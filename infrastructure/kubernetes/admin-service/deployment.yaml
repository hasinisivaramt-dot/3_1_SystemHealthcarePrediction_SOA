apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-service
  namespace: healix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-service
  template:
    metadata:
      labels:
        app: admin-service
    spec:
      containers:
        - name: admin-service
          image: healix/admin-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: admin-service-config
