apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: healix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      containers:
        - name: ai-service
          image: healix/ai-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-service-config
