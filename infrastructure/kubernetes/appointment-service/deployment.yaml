apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
  namespace: healix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: appointment-service
  template:
    metadata:
      labels:
        app: appointment-service
    spec:
      containers:
        - name: appointment-service
          image: healix/appointment-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: appointment-service-config
