apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-service
  namespace: healix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: doctor-service
  template:
    metadata:
      labels:
        app: doctor-service
    spec:
      containers:
        - name: doctor-service
          image: healix/doctor-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: doctor-service-config
