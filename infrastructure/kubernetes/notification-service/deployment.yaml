apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: healix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: healix/notification-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: notification-service-config
