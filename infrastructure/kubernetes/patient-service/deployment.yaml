apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-service
  namespace: healix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: patient-service
  template:
    metadata:
      labels:
        app: patient-service
    spec:
      containers:
        - name: patient-service
          image: healix/patient-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: patient-service-config
