apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: healix
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      containers:
        - name: recommendation-service
          image: healix/recommendation-service:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: recommendation-service-config
